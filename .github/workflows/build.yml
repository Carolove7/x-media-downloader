name: Build

# 推送到 main、dev、打 v* 标签或手动触发时，都会自动构建 Windows 安装包
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prerelease:
        description: "是否发布为 Pre-release"
        type: boolean
        default: true
      tag_name:
        description: "Release Tag (例如 v1.1.0-pre)"
        type: string
        default: "v1.1.0-pre"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链 (MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: npm install

      - name: 确定发布参数
        id: release_info
        shell: bash
        run: |
          TAG=""
          IS_PRE="false"
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            TAG="${{ github.ref_name }}"
            if [[ "$TAG" == *"pre"* ]] || [[ "$TAG" == *"dev"* ]] || [[ "$TAG" == *"beta"* ]] || [[ "$TAG" == *"rc"* ]]; then
              IS_PRE="true"
            fi
          elif [[ -n "${{ inputs.tag_name }}" ]]; then
            TAG="${{ inputs.tag_name }}"
            if [[ "${{ inputs.prerelease }}" == "true" ]]; then
              IS_PRE="true"
            fi
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT

      - name: 编译 Tauri 并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_info.outputs.tag_name }}
          releaseName: ${{ steps.release_info.outputs.tag_name != '' && format('X Media Downloader {0}', steps.release_info.outputs.tag_name) || '' }}
          releaseBody: ${{ steps.release_info.outputs.is_prerelease == 'true' && '### X Media Downloader Fluent Design 预览版 (Pre-release)&#10;- 采用 Fluent Design 2 (Windows 11) 规范设计与沉浸式无边框窗口&#10;- 包含自定义标题栏原生交互、亚克力微光卡片与硬件信息磁贴质感&#10;- 后端下载与 GraphQL 逻辑完全保持稳定不变' || 'GitHub Actions 自动构建的 Windows x64 安装包。' }}
          releaseDraft: false
          prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}

      - name: 上传构建产物
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/dev' && 'xmd-fluent-prerelease-build' || 'x-media-downloader-build' }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
