name: Build and Release EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 CLI 依赖
        run: npm install

      - name: 编译 Tauri 并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.10
          releaseName: "X Media Downloader v1.0.10"
          releaseBody: "X / Twitter Media Downloader Tauri + Rust Windows x64 构建版本。"
          releaseDraft: false
          prerelease: false
