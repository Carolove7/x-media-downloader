[package]
name = "x-media-downloader"
version = "1.0.0"
description = "X媒体下载器 - Tauri/Rust 版"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
futures-util = "0.3"
regex = "1"
md-5 = "0.10"
chrono = "0.4"
rfd = "0.15"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
