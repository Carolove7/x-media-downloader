[package]
name = "twitter-media-downloader"
version = "1.0.17"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
tauri-plugin-dialog = "2.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["native-tls", "json", "stream", "gzip", "deflate", "socks"] }
futures-util = "0.3"
chrono = "0.4"
thiserror = "1.0"
dirs = "5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
