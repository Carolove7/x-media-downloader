[package]
name = "twitter-media-downloader"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["dialog-all", "fs-all", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
chrono = "0.4"
thiserror = "1.0"
dirs = "5.0"

[features]
# 生产构建 / 未在 tauri.conf.json 指定 dev server 时由 Tauri CLI 启用
# 该 feature 必须转发给 tauri crate 的 custom-protocol
custom-protocol = ["tauri/custom-protocol"]
