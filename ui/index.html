<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X媒体下载器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- 账户设置卡片 -->
    <section class="card config-card">
      <div class="card-title">账户设置</div>
      <div class="form-body">
        <!-- 账户 ID -->
        <div class="form-row">
          <label for="userId">账户 ID:</label>
          <div class="input-wrap">
            <input type="text" id="userId" list="recentUserIds" placeholder="例如: elonmusk" autocomplete="off" />
            <datalist id="recentUserIds"></datalist>
          </div>
        </div>

        <!-- 保存位置 -->
        <div class="form-row">
          <label for="savePath">保存位置:</label>
          <div class="input-with-button">
            <input type="text" id="savePath" placeholder="选择媒体文件保存目录..." />
            <button id="btnBrowse" class="btn btn-ghost">选择...</button>
          </div>
        </div>

        <!-- auth_token -->
        <div class="form-row">
          <label for="authToken">auth_token:</label>
          <div class="input-wrap">
            <input type="text" id="authToken" placeholder="填入浏览器 Cookie 中的 auth_token" autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <!-- ct0 -->
        <div class="form-row">
          <label for="ct0">ct0:</label>
          <div class="input-wrap">
            <input type="text" id="ct0" placeholder="填入浏览器 Cookie 中的 ct0" autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <!-- 代理设置 (可选) -->
        <div class="form-row">
          <label for="proxyInput">代理服务器:</label>
          <div class="input-wrap">
            <input type="text" id="proxyInput" placeholder="可选，留空自动检测系统代理，例如: http://127.0.0.1:7890" autocomplete="off" spellcheck="false" />
          </div>
        </div>

        <!-- 时间范围 -->
        <div class="form-row">
          <label>时间范围:</label>
          <div class="date-range">
            <span class="date-label">起始</span>
            <select id="startYear" class="date-select"></select>
            <select id="startMonth" class="date-select"></select>
            <select id="startDay" class="date-select"></select>
            <span class="date-label">至</span>
            <select id="endYear" class="date-select"></select>
            <select id="endMonth" class="date-select"></select>
            <select id="endDay" class="date-select"></select>
            <label class="checkbox-inline">
              <input type="checkbox" id="chkUnlimitedTime" checked />
              <span>不限时间</span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <!-- 操作卡片 -->
    <section class="card action-card">
      <div class="action-row">
        <button id="btnStart" class="btn btn-primary">开始下载</button>
        <button id="btnCancel" class="btn btn-danger" disabled>取消下载</button>

        <span class="inline-label">类型</span>
        <div class="segmented" id="mediaFilter">
          <button data-value="all" class="active">全部媒体</button>
          <button data-value="image">仅图片</button>
          <button data-value="video">仅视频</button>
        </div>

        <span class="inline-label">线程数</span>
        <select id="concurrency" class="concurrency-select">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="4">4</option>
          <option value="6">6</option>
          <option value="8" selected>8</option>
          <option value="12">12</option>
          <option value="16">16</option>
          <option value="24">24</option>
          <option value="32">32</option>
        </select>

        <button id="btnOpenDir" class="btn btn-ghost">打开目录</button>
        <span id="statusBadge" class="status-text">状态: 就绪</span>
      </div>

      <div class="progress-row">
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
        </div>
        <span id="progressText" class="progress-text">0%</span>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-strip" style="background: #00ba7c;"></div>
          <div class="stat-value-wrap">
            <span id="statDownloaded" class="stat-value" style="color: #00ba7c;">0</span>
            <span class="stat-unit">项</span>
          </div>
          <div class="stat-label">已下载</div>
        </div>
        <div class="stat-card">
          <div class="stat-strip" style="background: #ffd400;"></div>
          <div class="stat-value-wrap">
            <span id="statSkipped" class="stat-value" style="color: #ffd400;">0</span>
            <span class="stat-unit">项</span>
          </div>
          <div class="stat-label">已跳过(重复)</div>
        </div>
        <div class="stat-card">
          <div class="stat-strip" style="background: #f4212e;"></div>
          <div class="stat-value-wrap">
            <span id="statFailed" class="stat-value" style="color: #f4212e;">0</span>
            <span class="stat-unit">项</span>
          </div>
          <div class="stat-label">失败</div>
        </div>
        <div class="stat-card">
          <div class="stat-strip" style="background: #2f6fdb;"></div>
          <div class="stat-value-wrap">
            <span id="statSpeed" class="stat-value" style="color: #2f6fdb;">0</span>
            <span id="statSpeedUnit" class="stat-unit">B/s</span>
          </div>
          <div class="stat-label">实时速度</div>
        </div>
      </div>
    </section>

    <!-- 日志卡片 -->
    <section class="card log-card">
      <div class="log-header">
        <span class="card-title" style="margin: 0;">运行日志</span>
        <div class="log-actions">
          <button id="btnCopyLog" class="btn btn-ghost btn-sm">复制</button>
          <button id="btnClearLog" class="btn btn-ghost btn-sm">清空</button>
        </div>
      </div>
      <div id="logArea" class="log-area"></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
