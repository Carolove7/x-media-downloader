<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Media Downloader Pro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="logo-box">
        <div class="logo-icon">𝕏</div>
        <div>
          <h1>X / Twitter 媒体下载器</h1>
          <p class="subtitle">高性能 Rust 异步内核 · 智能去重 · 实时进度监控</p>
        </div>
      </div>
      <div id="statusBadge" class="status-badge ready">就绪</div>
    </header>

    <section class="card config-card">
      <div class="form-grid">
        <div class="form-group">
          <label for="userId">用户 ID (@Screen Name)</label>
          <input type="text" id="userId" placeholder="例如: elonmusk" />
        </div>

        <div class="form-group">
          <label for="concurrency">并发连接数 (1 - 32)</label>
          <input type="number" id="concurrency" min="1" max="32" value="8" />
        </div>

        <div class="form-group full-width">
          <label for="savePath">存储位置</label>
          <div class="input-with-button">
            <input type="text" id="savePath" placeholder="选择媒体文件保存目录..." />
            <button id="btnBrowse" class="btn btn-secondary">浏览...</button>
          </div>
        </div>

        <div class="form-group">
          <label for="authToken">Cookie: auth_token</label>
          <input type="password" id="authToken" placeholder="填入浏览器 Cookie 中的 auth_token" />
        </div>

        <div class="form-group">
          <label for="ct0">Cookie: ct0 (CSRF Token)</label>
          <input type="password" id="ct0" placeholder="填入浏览器 Cookie 中的 ct0" />
        </div>
      </div>
    </section>

    <section class="card action-card">
      <div class="btn-group">
        <button id="btnStart" class="btn btn-primary">开始极速下载</button>
        <button id="btnCancel" class="btn btn-danger" disabled>取消任务</button>
      </div>

      <div class="metrics-grid">
        <div class="metric-item">
          <span class="metric-label">总处理进度</span>
          <span id="metricProgress" class="metric-value">0%</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">新增下载</span>
          <span id="metricDownloaded" class="metric-value count-success">0</span>
        </div>
        <div class="metric-item">
          <span class="metric-label">跳过已存在</span>
          <span id="metricSkipped" class="metric-value count-warning">0</span>
        </div>
      </div>

      <div class="progress-bar-container">
        <div id="progressBar" class="progress-bar" style="width: 0%;"></div>
      </div>
    </section>

    <section class="card log-card">
      <div class="log-header">
        <span>实时运行日志</span>
        <button id="btnClearLog" class="btn-text">清空</button>
      </div>
      <div id="logArea" class="log-area"></div>
    </section>
  </div>

  <script src="main.js"></script>
</body>
</html>
